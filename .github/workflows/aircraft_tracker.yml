name: Aircraft Tracker
on:
  workflow_dispatch: # Manual / API Triggers
    inputs:
      lat:
        description: 'Latitude'
        default: '50.77'
      lon:
        description: 'Longitude' 
        default: '0.28'
      city:
        description: 'City name'
        default: 'Eastbourne'

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git pull origin main --rebase || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Check Airspace
        run: python Nexus_System/modules/aircraft_tracker.py
        env:
          AIRCRAFT_WEBHOOK_URL: ${{ secrets.AIRCRAFT_WEBHOOK_URL }}
          OVERRIDE_LAT: ${{ github.event.inputs.lat }}
          OVERRIDE_LON: ${{ github.event.inputs.lon }}
          OVERRIDE_CITY: ${{ github.event.inputs.city }}
